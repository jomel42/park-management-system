<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel Gestor | Sistema de Parques</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@300;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap');

    :root{
      --g900:#081408;
      --g800:#0d1f0d;
      --g700:#163116;
      --g600:#215221;
      --g500:#2f7d32;
      --g400:#4caf50;
      --g300:#81c784;
      --g200:#c8e6c9;
      --crema:#f5f5f5;
      --rojo:#e53935;
      --amarillo:#ffb300;
      --azul:#2196f3;
      --morado:#8e24aa;
      --nav-w:270px;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Raleway',sans-serif;
      background:var(--g900);
      color:var(--crema);
      display:flex;
      min-height:100vh;
      overflow:hidden;
    }

    /* SIDEBAR */

    .sidebar{
      width:var(--nav-w);
      background:linear-gradient(180deg,#061206 0%, #0b1f0b 100%);
      border-right:1px solid var(--g700);
      display:flex;
      flex-direction:column;
    }

    .logo{
      padding:24px;
      border-bottom:1px solid var(--g700);
    }

    .logo-icon{
      font-size:3rem;
      margin-bottom:10px;
    }

    .logo h1{
      font-size:1.6rem;
      font-weight:900;
      color:var(--g200);
    }

    .logo p{
      font-size:.8rem;
      color:#6aa56a;
      font-family:'IBM Plex Mono', monospace;
      margin-top:4px;
    }

    .usuario{
      padding:20px;
      display:flex;
      align-items:center;
      gap:12px;
      border-bottom:1px solid var(--g700);
      background:rgba(0,0,0,.2);
    }

    .avatar{
      width:48px;
      height:48px;
      border-radius:50%;
      background:var(--g600);
      border:2px solid var(--g400);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:1.2rem;
    }

    .usuario h3{
      font-size:1rem;
    }

    .usuario p{
      font-size:.75rem;
      color:var(--g300);
      font-family:'IBM Plex Mono', monospace;
    }

    .menu{
      flex:1;
      padding:20px 0;
      overflow-y:auto;
    }

    .menu-title{
      font-size:.7rem;
      color:#5a8a5a;
      padding:0 24px 10px;
      text-transform:uppercase;
      letter-spacing:2px;
      font-family:'IBM Plex Mono', monospace;
    }

    .menu-item{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 24px;
      color:#8fb38f;
      cursor:pointer;
      transition:.2s;
      border-left:4px solid transparent;
      font-weight:600;
    }

    .menu-item:hover{
      background:rgba(76,175,80,.08);
      color:white;
    }

    .menu-item.active{
      background:rgba(76,175,80,.12);
      border-left-color:var(--g400);
      color:var(--g300);
    }

    .logout{
      padding:18px;
      border-top:1px solid var(--g700);
    }

    .logout button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:rgba(229,57,53,.1);
      color:#ff8a8a;
      cursor:pointer;
      font-weight:700;
      transition:.2s;
    }

    .logout button:hover{
      background:rgba(229,57,53,.2);
    }

    /* CONTENIDO */

    .contenido{
      flex:1;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .topbar{
      padding:22px 30px;
      border-bottom:1px solid var(--g700);
      background:linear-gradient(90deg,#071407,#0c240c);
    }

    .topbar h2{
      color:var(--g200);
      font-size:2rem;
      font-weight:900;
    }

    .topbar p{
      color:#5f9c5f;
      font-family:'IBM Plex Mono', monospace;
      margin-top:5px;
    }

    .contenido-scroll{
      flex:1;
      overflow-y:auto;
      padding:30px;
    }

    /* SECCIONES */

    .seccion{
      display:none;
    }

    .seccion.active{
      display:block;
    }

    iframe{
      width:100%;
      height:calc(100vh - 160px);
      border:none;
      border-radius:14px;
      background:transparent; /* Cambiado para no verse feo mientras carga */
    }

    /* DASHBOARD */

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:20px;
      margin-bottom:30px;
    }

    .card{
      background:linear-gradient(180deg,#092109,#0d2c0d);
      border:1px solid var(--g700);
      border-radius:16px;
      padding:26px;
    }

    .card h3{
      font-size:.9rem;
      text-transform:uppercase;
      color:var(--g200);
      margin-bottom:12px;
    }

    .card .numero{
      font-size:4rem;
      font-weight:900;
    }

    .card.blue{
      border-bottom:5px solid var(--azul);
    }

    .card.red{
      border-bottom:5px solid var(--rojo);
    }

    .card.green{
      border-bottom:5px solid var(--g400);
    }

    @media(max-width:900px){

      body{
        flex-direction:column;
      }

      .sidebar{
        width:100%;
        height:auto;
      }

      .contenido{
        width:100%;
      }

      iframe{
        height:600px;
      }
    }

  </style>
  <link rel="stylesheet" href="/css/system-responsive.css">
  <script src="/js/system-form-helpers.js" defer></script>
</head>
<body>

  <aside class="sidebar">

    <div class="logo">
      <div class="logo-icon">🛠️</div>
      <h1>Gestor de Parques</h1>
      <p>Operaciones Municipales</p>
    </div>

    <div class="usuario">
      <div class="avatar" id="avatar">G</div>

      <div>
        <h3 id="nombre-user">Gestor</h3>
        <p>Gestor</p>
      </div>
    </div>

    <div class="menu">

      <div class="menu-title">General</div>

      <div class="menu-item active" onclick="mostrarSeccion('dashboard', this)">
        🏠 Panel Control
      </div>

      <div class="menu-title" style="margin-top:20px;">
        Módulos
      </div>

      <div class="menu-item" onclick="mostrarSeccion('parques', this)">
        🌳 Parques
      </div>

      <div class="menu-item" onclick="mostrarSeccion('canchas', this)">
        🏟️ Canchas
      </div>

      <div class="menu-item" onclick="mostrarSeccion('mapas', this)">
        🗺️ Mapas
      </div>

      <div class="menu-item" onclick="mostrarSeccion('reportes', this)">
        📋 Mis tareas
      </div>

    </div>

    <div class="logout">
      <button onclick="cerrarSesion()">
        🚪 Cerrar Sesión
      </button>
    </div>

  </aside>

  <main class="contenido">

    <div class="topbar">
      <h2 id="titulo-top">Panel de Operaciones</h2>
      <p id="breadcrumb">
        Sistema de Parques → Panel Control
      </p>
    </div>

    <div class="contenido-scroll">

      <section class="seccion active" id="dashboard">

        <div class="stats">

          <div class="card blue">
            <h3>Tareas asignadas</h3>
            <div class="numero" id="totales">0</div>
          </div>

          <div class="card red">
            <h3>Pendientes</h3>
            <div class="numero" id="pendientes">0</div>
          </div>

          <div class="card green">
            <h3>Resueltos</h3>
            <div class="numero" id="resueltos">0</div>
          </div>

        </div>

      </section>

      <section class="seccion" id="parques">
        <iframe src="/admin-assets/gestor/parques/interfaces/parques.html"></iframe>
      </section>

      <section class="seccion" id="canchas">
        <iframe src="/admin-assets/canchas/interfaces/canchas.html"></iframe>
      </section>

      <section class="seccion" id="mapas">
        <iframe src="/admin-assets/mapa/interfaces/mapa.html"></iframe>
      </section>

      <section class="seccion" id="reportes">
        <iframe src="/admin-assets/gestor/reportes/interfaces/reportes.html"></iframe>
      </section>

    </div>

  </main>

<script>

const API_URL = "/api";

function mostrarSeccion(id, elemento){
  // 1. Ocultar todas las secciones y limpiar el menú activo
  document.querySelectorAll(".seccion").forEach(sec => sec.classList.remove("active"));
  document.querySelectorAll(".menu-item").forEach(item => item.classList.remove("active"));

  // 2. Activar la sección correspondiente y pintar el menú
  document.getElementById(id).classList.add("active");
  elemento.classList.add("active");

  // 3. Cambiar los títulos dinámicamente
  const titulos = {
    dashboard: "Panel de Operaciones",
    parques: "Gestión de Parques",
    canchas: "Gestión de Canchas",
    mapas: "Mapa de Parques",
    reportes: "Mis tareas asignadas"
  };

  document.getElementById("titulo-top").textContent = titulos[id];
  document.getElementById("breadcrumb").textContent = `Sistema de Parques → ${titulos[id]}`;
}

function obtenerHeaders(){
  return {
    "Authorization": `Bearer ${localStorage.getItem("token")}`,
    "Content-Type": "application/json"
  };
}

function verificarSesion(){
  const user = JSON.parse(localStorage.getItem("user") || "null");
  const token = localStorage.getItem("token");

  if(!user || !token){
    window.location.href="/login";
    return;
  }

  if(Number(user.id_rol) !== 2){
    window.location.href="/login";
    return;
  }

  document.getElementById("nombre-user").textContent = user.nombre;
  document.getElementById("avatar").textContent = user.nombre?.[0]?.toUpperCase() || "G";

  cargarDatosDashboard();
}

async function cargarDatosDashboard(){
  try {
    const res = await fetch(`${API_URL}/reportes/gestor/mis-tareas`, { headers: obtenerHeaders() });
    
    if(!res.ok) throw new Error("Error obteniendo reportes");
    
    const json = await res.json();
    const reportes = json.ok ? json.data : [];

    // Actualizar las tarjetas
    document.getElementById("totales").textContent = reportes.length;
    document.getElementById("pendientes").textContent = reportes.filter(r => Number(r.id_estado_reporte) === 1 || Number(r.id_estado_reporte) === 2).length;
    document.getElementById("resueltos").textContent = reportes.filter(r => r.estado === "Resuelto").length;

  } catch(error) {
    console.error("Error al cargar dashboard:", error);
    document.getElementById("totales").textContent = "!";
    document.getElementById("pendientes").textContent = "!";
    document.getElementById("resueltos").textContent = "!";
  }
}

function cerrarSesion(){
  fetch("/api/auth/logout", { method:"POST" }).catch(() => {});
  localStorage.removeItem("token");
  localStorage.removeItem("user");
  window.location.href = "/login";
}

window.onload = verificarSesion;

</script>

</body>
</html>
